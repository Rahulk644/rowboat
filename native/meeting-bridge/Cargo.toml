[package]
name = "meeting-bridge"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "Supervised local capture and meeting-evidence bridge for Rowboat"
repository = "https://github.com/rowboat/rowboat"

[features]
default = []
# FlexAudio is deliberately opt-in until its timestamp and device-watcher
# qualification gates pass on real macOS and Windows machines. The revision is
# pinned rather than tracking a branch so the A/B result is reproducible.
flexaudio = ["dep:flexaudio"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# MIT — https://github.com/Studio-Sadola/flexaudio
# audited revision: 7e41bbd0b03c4f52260926fa0148ca0e0179fda1
# See README.md for the qualification and rollback requirements.
flexaudio = { git = "https://github.com/Studio-Sadola/flexaudio", rev = "7e41bbd0b03c4f52260926fa0148ca0e0179fda1", package = "flexaudio", optional = true }

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
