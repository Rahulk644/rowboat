[package]
name = "meeting-bridge"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "Supervised local capture and meeting-evidence bridge for Rowboat"
repository = "https://github.com/rowboat/rowboat"

[features]
default = []
# FlexAudio is deliberately opt-in until its timestamp and device-watcher
# qualification gates pass on real macOS and Windows machines. The revision is
# pinned rather than tracking a branch so the A/B result is reproducible.
flexaudio = ["dep:flexaudio"]
# Anarlog's `meeting_ax` implementation is MIT-licensed.  We vendor only the
# bounded native Zoom inspection path behind an explicit macOS feature; it
# never enables a browser extension, Calendar identity, or AX mutation.
anarlog-ax = ["dep:cidre", "dep:macos-accessibility-client"]
# These feature flags expose only the audited integration boundary and pin
# metadata.  They intentionally do not fetch, link, or package a model/library
# until its native source, model checksum, reblocking adapter, SBOM, and
# platform build are all reviewed.  Raw microphone pass-through remains the
# behavior when no qualified processor is injected by the native host.
aec-localvqe = ["dep:libloading", "dep:sha2"]
aec-webrtc-aec3 = ["dep:webrtc-audio-processing"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
base64 = "=0.22.1"
libloading = { version = "=0.8.9", optional = true }
sha2 = { version = "=0.10.9", optional = true }
# BSD-3-Clause — https://github.com/tonarino/webrtc-audio-processing
# audited v2.1.0 source: c14d7af1760baff83e8210fee336a0cae0faaa7d;
# PulseAudio WebRTC submodule: d0569cfa.  Build its reviewed bundled source
# only when the comparator feature is explicitly selected; this avoids relying
# on an arbitrary system library with unknown build flags or ABI.
webrtc-audio-processing = { version = "=2.1.0", default-features = false, features = ["bundled"], optional = true }

# MIT — https://github.com/Studio-Sadola/flexaudio
# audited revision: 7e41bbd0b03c4f52260926fa0148ca0e0179fda1
# See README.md for the qualification and rollback requirements.
flexaudio = { git = "https://github.com/Studio-Sadola/flexaudio", rev = "7e41bbd0b03c4f52260926fa0148ca0e0179fda1", package = "flexaudio", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
# Transitive dependency versions are locked from the audited Anarlog revision
# in Cargo.lock.  The code uses only its safe AX/NS wrappers.
cidre = { version = "=0.15.0", features = ["ax"], optional = true }
macos-accessibility-client = { version = "=0.0.1", optional = true }

[lints.rust]
# `anarlog_ax` has one audited conversion for the typed `AXWindows` array.
# Keep all other unsafe code denied at the crate boundary.
unsafe_code = "deny"
missing_debug_implementations = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
